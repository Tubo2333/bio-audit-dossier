rule_id: Q1.2-QC-002
domain: QC
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2019]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "线粒体基因阈值 / Mitochondrial gene threshold"
description: "线粒体基因比例过高指示细胞膜破损/凋亡（胞质 mRNA 漏出，Luecken & Theis 2019）。不同组织/细胞类型的线粒体表达基线不同(心肌>上皮>免疫), 阈值应按样本分布确定而非一刀切（2026-09-16 收尾核查：原「20-25%」区间非该文主张，已移除）。"
condition:
  decision_type: qc_mito_threshold
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - adaptive_mito_threshold
      - MAD5_mito
    description: "自适应线粒体阈值 — 根据每个样本/组织的Mito%分布动态确定"
    rationale: "不同细胞类型线粒体含量不同, 自适应阈值避免一刀切"
  level_2:
    methods:
      - tissue_adjusted_threshold
    description: "组织特异性固定阈值 — 比全局固定阈值好但仍不如自适应"
    conditions_when_acceptable: "当数据集来自单一同质组织且样本数充足时"
  level_1:
    methods:
      - global_hard_25_percent
      - fixed_mito_25
    description: "全局固定阈值(如25%) — 不考虑组织差异"
    note: "肿瘤样本中高代谢细胞线粒体比例可能天然偏高, 固定阈值可能误删"
  level_0:
    methods:
      - no_mito_filter
      - mito_50_percent
    description: "无线粒体过滤或阈值过高(>50%) — 死细胞/凋亡细胞残留"

evidence:
  - source_type: consensus_guideline
    pmid: "31217225"
    doi: "10.15252/msb.20188746"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Confirmed
    excerpt: "A high fraction of mitochondrial counts indicates cells whose cytoplasmic mRNA has leaked through a broken membrane; if the distribution of QC covariates differs between samples, QC thresholds should be determined separately for each sample."
    supports_levels: ["level_3", "level_2", "level_1"]
    # 2026-09-16 收尾核对（窗口自查原文）：「20-30%」全文 0 命中（属领域约定非该文主张）；原文为逐样本定阈值而非 tissue-specific → 口径随原文收紧（详见 DP-scRNA-REVIEW-FEEDBACK.md「收尾核查」节）
  - source_type: benchmark_paper
    pmid: "30902100"
    doi: "10.1186/s13059-019-1662-y"
    title: "EmptyDrops: distinguishing cells from empty droplets in droplet-based single-cell RNA sequencing data — Lun et al. 2019, Genome Biology"
    confidence: L-Confirmed
    excerpt: "Cell quality metrics including mitochondrial percentage must be considered."
    supports_levels: ["level_2"]
conflicts_with: []
