rule_id: T1.2-TRAJ-002_annotation_precondition
domain: TRAJECTORY
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2019]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "轨迹推断的前置条件: 正确的细胞注释 / Precondition: correct cell annotation"
description: "轨迹推断必须在正确的细胞类型注释基础上进行。如果细胞类型注释错误(如把巨噬细胞误标为上皮细胞), 则推断的'上皮-间质转化轨迹'实际上是髓系-淋巴系差异。轨迹推断的起始/终点细胞类型必须经过marker验证。"
condition:
  decision_type: trajectory_validation
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - trajectory_on_validated_annotation
      - start_end_validated
    description: "基于已交叉验证的注释进行轨迹推断, 起点/终点已验证"
  level_2:
    methods:
      - trajectory_on_single_method_annotation
    description: "基于单一注释方法 — 注释可能有系统性错误影响轨迹解释"
    conditions_when_acceptable: "当单一方法注释结果与已知marker一致时"
  level_1:
    methods:
      - trajectory_annotation_not_validated
    description: "轨迹推断完成但注释未验证 — 可能将技术伪迹解释为生物学过程"
    note: "不同患者的细胞可能在UMAP上形成'轨迹', 但这可能只是批次效应"
  level_0:
    methods:
      - trajectory_without_annotation
      - trajectory_on_QC_failed_data
    description: "无注释轨迹推断 / QC未通过的数据做轨迹 — 结果无生物学意义"

evidence:
  - source_type: benchmark_paper
    pmid: "30936559"
    doi: "10.1038/s41587-019-0071-9"
    title: "A comparison of single-cell trajectory inference methods — Saelens et al. 2019, Nature Biotechnology"
    confidence: L-Confirmed
    excerpt: "Incorrect or noisy prior information can bias the trajectory towards current knowledge."
    supports_levels: ["level_3", "level_0"]
    # 2026-09-16 收尾核对（窗口自查原文）：该文 Discussion 逐字；全文无「结果关键取决于上游预处理/注释质量」主张（最近的论述是 prior information 偏倚，非预处理质量）→ 换为该文实际主张
  - source_type: consensus_guideline
    pmid: "31217225"
    doi: "10.15252/msb.20188746"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Evidenced
    excerpt: "The validity of the identified clusters can only be determined by successful annotation of the represented biology; trajectories are inferred over clusters (e.g. Slingshot applied to clusters in PCA space)."
    supports_levels: ["level_3", "level_2"]
    # 2026-09-16 收尾核查补核：原文近义组合（Cluster annotation 节 + Trajectory 节），非逐字「注释质量直接决定轨迹可解释性」
conflicts_with: []
