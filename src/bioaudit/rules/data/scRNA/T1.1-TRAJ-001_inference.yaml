rule_id: T1.1-TRAJ-001_inference
domain: TRAJECTORY
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2014, 2026]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "轨迹推断方法 / Trajectory inference method"
description: "轨迹推断(pseudotime analysis)揭示细胞分化/状态转变过程。monocle3 (基于RNA velocity)和slingshot (基于最小生成树)是最常用的方法。Saelens et al. (2019) 的基准测试显示不同方法适用于不同轨迹拓扑结构(线性/分叉/树/循环)。方法选择应考虑预期的生物学过程(如EMT→分叉, 发育→树)。"
condition:
  decision_type: trajectory_inference
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - monocle3
      - slingshot_with_topology_check
    description: "monocle3/slingshot — 经广泛验证的轨迹推断方法"
    rationale: "monocle3 基于 RNA velocity 提供方向性; slingshot 稳健处理多种拓扑结构"
  level_2:
    methods:
      - PAGA
      - scVelo
      - diffusion_map
    description: "PAGA/scVelo/diffusion map — 特定场景有效"
    conditions_when_acceptable: "PAGA适合发育图谱; scVelo需要未剪接/剪接reads数据; diffusion map适合连续过程"
  level_1:
    methods:
      - monocle2
      - wishbone
    description: "旧版方法 — monocle2已被monocle3取代; wishbone假设分叉结构"
    note: "monocle2使用不同的统计算法, 已被monocle3取代"
  level_0:
    methods:
      - no_validation
      - wrong_topology
      - no_trajectory
    description: "未验证轨迹拓扑结构与生物学预期的一致性 / 该做没做（跳过轨迹推断）"
    rationale: "如果生物学过程是连续的(EMT), 强行拟合分叉模型会产生虚假分支点。no_trajectory（研究需轨迹推断时跳过）= 该做没做，结论缺失时间维度证据——合理省略豁免（when_not_applicable=study_not_trajectory_focused 满足）在 expected_types 评测配置层判定，引擎无研究范围证据时保守评 L0（窗口 M 词表补齐 2026-08-16，K 遗留①收尾 + B7 联动）"

evidence:
  - source_type: benchmark_paper
    pmid: "30936559"
    doi: "10.1038/s41587-019-0071-9"
    title: "A comparison of single-cell trajectory inference methods — Saelens et al. 2019, Nature Biotechnology"
    confidence: L-Confirmed
    excerpt: "No single method outperforms all others; method choice should match expected trajectory topology."
    supports_levels: ["level_3", "level_2"]
  - source_type: method_paper
    pmid: "24658644"
    doi: "10.1038/nbt.2859"
    title: "The dynamics and regulators of cell fate decisions are revealed by pseudotemporal ordering of single cells — Trapnell et al. 2014, Nature Biotechnology"
    confidence: L-Evidenced
    excerpt: "Monocle pioneered pseudotemporal ordering of single cells using reversed graph embedding."
    supports_levels: ["level_3", "level_1"]
conflicts_with: []
