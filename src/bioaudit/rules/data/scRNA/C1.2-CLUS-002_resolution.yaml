rule_id: C1.2-CLUS-002_resolution
domain: CLUSTER
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2019]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "聚类分辨率选择 / Clustering resolution"
description: "Leiden/Louvain 分辨率参数 (resolution) 控制聚类粒度。分辨度过低→不同细胞类型被合并; 过高→同一细胞类型被过度分裂。建议进行多分辨率比较并用稳定性分析验证（Luecken & Theis 2019 主张多分辨率+子聚类；2026-09-16 收尾核查：clustree 非该文主张，已从证据层移除），或基于已知marker的silhouette评分选择。肿瘤单细胞通常 resolution 0.4-1.2。"
condition:
  decision_type: clustering_resolution
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - clustree_stability_analysis
      - silhouette_optimization
      - multi_resolution_validated
    description: "Clustree/silhouette 优化 — 基于稳定性的客观选参"
    rationale: "多分辨率稳定性分析避免人为选择偏差"
  level_2:
    methods:
      - known_marker_guided
      - domain_expert_chosen
    description: "基于已知marker/领域知识选择 — 合理且可复现"
    conditions_when_acceptable: "当有明确的marker基因列表验证每种resolution时"
  level_1:
    methods:
      - default_0_8
      - resolution_too_low
    description: "默认值 (如0.8) — 不考虑数据特征, 可能过粗或过细"
    note: "0.8是Seurat默认但适应范围有限, 不同数据集需要不同值"
  level_0:
    methods:
      - resolution_too_high
      - resolution_no_validation
    description: "分辨率过高 (>2.0) 或完全无验证 — 过度分裂, 产生难以注释的cluster碎片"
    rationale: "过高的resolution产生数十个无生物学意义的cluster碎片"

evidence:
  - source_type: method_paper
    pmid: "30914743"
    title: "From Louvain to Leiden — Traag et al. 2019, Scientific Reports"
    confidence: L-Evidenced
    excerpt: "Resolution parameter critically affects clustering granularity in modularity-based methods."
    supports_levels: ["level_3", "level_2"]
  - source_type: consensus_guideline
    pmid: "31217225"
    doi: "10.15252/msb.20188746"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Confirmed
    excerpt: "Clustering does not have to be performed at a single resolution; subclustering particular cell clusters is a valid approach."
    supports_levels: ["level_3"]
    # 2026-09-16 收尾核对（窗口自查原文）：该文 Clustering 节 Pitfalls 逐字支持多分辨率；「clustree」全文 0 命中 → 移除 clustree 表述（详见 DP-scRNA-REVIEW-FEEDBACK.md「收尾核查」节）
conflicts_with: []
