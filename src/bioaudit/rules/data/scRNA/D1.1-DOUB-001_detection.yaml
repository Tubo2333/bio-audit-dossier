# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2021]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "双联体检测方法 / Doublet detection method"
description: "10X Genomics 单细胞数据中双联体比例通常为 0.5-8%（随细胞浓度增加）。不检测双联体会导致虚假的'共表达'和'新细胞类型'。scDblFinder 基于模拟双联体的随机森林是最新推荐方法。"
condition:
  decision_type: doublet_detection
  required_context:
    sequencing: 10X_scRNA_seq
  forbidden_context: {}
  context_constraints:
    - "n_cells >= 1000"

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - scDblFinder
      - scrublet_with_scDblFinder
      - Solo_with_scDblFinder
    description: "scDblFinder — 基于模拟双联体的随机森林分类器"
    rationale: "Xi & Li (2021) 基准测试显示 scDblFinder 在多种场景下表现最优"
  level_2:
    methods:
      - DoubletFinder
      - Scrublet
    description: "DoubletFinder/Scrublet — 有效但比scDblFinder FPR略高"
    conditions_when_acceptable: "当scDblFinder不可用时, DoubletFinder是合理替代"
  level_1:
    methods:
      - Solo
      - cxds
    description: "Solo/cxds — 特定场景有效但通用性不足"
    note: "这些方法针对特定数据特征优化, 泛化性有限"
    conditions_when_acceptable: "当数据集特征与方法假设匹配时(如Solo适用于Smart-seq2)"
  level_0:
    methods:
      - no_doublet_detection
      - skip_doublet
      - manual_visual
    description: "无检测/纯目测 — 双联体未被识别, 下游聚类/注释/DEG被污染"
    rationale: "未去除的双联体在UMAP中形成独立cluster, 被误注释为'新细胞类型'"

evidence:
  - source_type: benchmark_paper
    pmid: "33338399"
    doi: "10.1016/j.cels.2020.11.008"
    title: "Benchmarking computational doublet-detection methods for single-cell RNA sequencing data — Xi & Li 2021, Cell Systems"
    confidence: L-Confirmed
    excerpt: "scDblFinder consistently performs well across diverse scRNA-seq datasets."
    supports_levels: ["level_3", "level_2"]
  - source_type: method_paper
    pmid: "30954475"
    doi: "10.1016/j.cels.2019.03.003"
    title: "DoubletFinder: Doublet detection in single-cell RNA sequencing data using artificial nearest neighbors — McGinnis et al. 2019, Cell Systems"
    confidence: L-Evidenced
    excerpt: "DoubletFinder identifies doublets using artificial nearest neighbor analysis."
    supports_levels: ["level_2"]
conflicts_with: []
