rule_id: B1.2-BATC-002_requirement
domain: BATCH
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2020]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "批次校正的必要性判断 / Batch correction requirement"
description: "当存在多个患者/样本来源时, 即使不同患者的细胞在UMAP中混合良好, 也必须进行批次校正评估。忽略批次效应可能导致假阳性DEG (技术差异被误认为生物学差异)。至少应可视化每个批次的细胞分布。"
condition:
  decision_type: batch_correction
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints:
    - "n_patients >= 3"

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - batch_corrected_with_qc
      - Harmony
      - scVI
    description: "已进行批次校正并QC验证(如kBET/LISI指标)"
  level_2:
    methods:
      - batch_visualized_no_correction
    description: "未做校正但做了批次可视化和评估"
    conditions_when_acceptable: "当批次效应评估(LISI/kBET)显示无显著批次效应时"
  level_1:
    methods:
      - batch_acknowledged_not_handled
    description: "认识到批次效应但未处理 — 风险可控但不理想"
    note: "建议至少做敏感性分析: 有vs无批次校正的结果对比"
  level_0:
    methods:
      - batch_ignored
      - merge_without_checking
    description: "完全忽略批次效应 — 最多样本直接合并, 未做任何批次评估"
    rationale: "批次效应是scRNA-seq最大的技术混淆因素之一, 忽略它 = 不可靠的结论"

evidence:
  - source_type: benchmark_paper
    pmid: "31948481"
    doi: "10.1186/s13059-019-1850-9"
    title: "A benchmark of batch-effect correction methods for single-cell RNA sequencing data — Tran et al. 2020, Genome Biology"
    confidence: L-Confirmed
    excerpt: "These differences lead to large variations or batch effects in the data, which can confound biological variations of interest during data integration; as such, effective batch-effect removal is essential."
    supports_levels: ["level_3", "level_0"]
    # 2026-09-16 收尾核对（窗口自查原文）：Tran 2020 原文逐字（PMC6964114）；「pervasive」非原文词 → 换为原文措辞
  - source_type: method_paper
    pmid: "30573817"
    doi: "10.1038/s41592-018-0254-1"
    title: "A test metric for assessing single-cell RNA-seq batch correction (kBET) — Büttner et al. 2019, Nature Methods"
    confidence: L-Evidenced
    excerpt: "kBET provides a quantitative measure of batch effects remaining after correction."
    supports_levels: ["level_3", "level_2"]
conflicts_with: []
