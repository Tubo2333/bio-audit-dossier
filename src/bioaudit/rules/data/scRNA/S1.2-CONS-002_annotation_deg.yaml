rule_id: S1.2-CONS-002_annotation_deg
domain: CONSISTENCY
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2021]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "注释-DEG跨模块一致性 / Annotation-DEG consistency"
description: "差异表达分析应覆盖所有主要注释细胞类型。如果只对T细胞做DEG而跳过其他7种细胞类型, 则无法得出'XX细胞类型在肿瘤中特异性富集'的结论。注释范围与DEG范围必须一致, 不一致需要解释(如某些细胞类型细胞数太少, 统计效力不足)。"
condition:
  decision_type: annotation_deg_consistency
  required_context:
    integration_type: cross_module
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - all_major_types_covered
      - deg_covers_all_annotated
    description: "所有主要注释细胞类型都有DEG分析, 未分析的细胞类型有合理解释"
  level_2:
    methods:
      - most_types_covered
    description: "大部分细胞类型覆盖, 少量跳过并有说明"
    conditions_when_acceptable: "当稀有细胞类型(n<50 cells)不足以支持统计检验时"
  level_1:
    methods:
      - selective_deg_only
    description: "仅对选定的细胞类型做DEG — 可能产生选择偏差"
    note: "选择性做DEG可能导致'cherry-picking': 只报告显著的结果而忽略不显著的"
  level_0:
    methods:
      - deg_contradicts_annotation
    description: "DEG结果与注释矛盾但未解决 — 如注释为'正常上皮'但DEG显示高度增殖"
    rationale: "如果'正常上皮'表达大量增殖marker(MKI67+), 注释可能是错误的(应为肿瘤上皮)"

evidence: []   # 2026-09-16 收尾核查补核（窗口自查原文）：Luecken & Theis 2019 无「对所有主要细胞类型做 DE」主张（major cell types 0 命中）；Squair 2021 亦无（覆盖/范围类主张 0 命中）→ 两槽位先后删除；本主张为规则自身综合（注释-DEG 跨模块一致性检查属于审计设计，非文献命题）
conflicts_with: []
