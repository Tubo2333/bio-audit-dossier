# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2026]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "降维方法 / Dimensionality reduction method"
description: "PCA 是单细胞分析的标准线性降维方法, 为聚类提供去噪的细胞-细胞距离矩阵。UMAP/t-SNE 用于可视化, 不应直接用作聚类的输入。PCA维度选择应基于客观方法(ElbowPlot/JackStraw)而非主观判断或默认值。"
condition:
  decision_type: dim_reduction
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
    method: PCA
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - PCA_elbow_selection
      - PCA_JackStraw
      - PCA_heatmap_selection
    description: "PCA + 客观选维 — ElbowPlot/JackStraw 确定PC数"
    rationale: "基于统计检验或方差解释率的客观选维, 避免主观偏差"
  level_2:
    methods:
      - PCA_default_30
      - PCA_fixed_50
    description: "PCA默认维度 — 30是Seurat默认, 50对于大型数据集合理"
    conditions_when_acceptable: "当数据集异质性高且ElbowPlot显示缓慢衰减时, 固定50可接受"
  level_1:
    methods:
      - PCA_fixed_10
      - PCA_fixed_15
      - PCA_arbitrary
    description: "PCA维度过低或任意选维 — 可能丢失稀有细胞类型的信号"
    note: "仅用10个PC可能捕获不到占比<5%的稀有细胞群体的变异。PCA_arbitrary（任意选维，无 elbow/JackStraw/方差解释依据）= 主观固定维度，与 PCA_fixed_10/15 同原则评 L1（窗口 M 词表补齐 2026-08-16，K 遗留①收尾；G 窗口 S7 实测 50 PCs 无依据）"
  level_0:
    methods:
      - tSNE_directly_for_clustering
      - UMAP_directly_for_clustering
    description: "直接用t-SNE/UMAP坐标聚类 — 违反图聚类假设"
    rationale: "t-SNE/UMAP的全局距离结构被扭曲, 不应作为聚类输入"

evidence:
  - source_type: consensus_guideline
    pmid: "31217225"
    doi: "10.15252/msb.20188746"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Confirmed
    excerpt: "PCA is commonly used as a preprocessing step and is the basis of many currently available analysis tools for clustering or trajectory inference; for visualization purposes, non-linear methods such as t-SNE are the standard practice."
    supports_levels: ["level_3", "level_0"]
  # 2026-09-16 收尾核对（窗口自查原文）：Saelens 2019 全文无「降维质量影响下游轨迹推断」主张（DR 仅出现于方法管线/计时语境，作者接受稿全文关键词检索 0 命中）→ 槽位删除
conflicts_with: []
