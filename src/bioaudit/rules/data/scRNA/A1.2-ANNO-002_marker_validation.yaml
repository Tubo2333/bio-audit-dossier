rule_id: A1.2-ANNO-002_marker_validation
domain: ANNOTATION
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2019, 2019]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "注释结果的marker基因验证 / Marker gene validation of annotation"
description: "任何自动注释方法的结果都应通过经典marker基因的表达模式进行验证。例如: T细胞(CD3D/CD8A), B细胞(CD19/MS4A1/CD79A), 巨噬细胞(CD68/CD14), 上皮细胞(EPCAM/KRT19)。如果自动注释为'T细胞'但cluster不表达CD3D, 则注释错误。"
condition:
  decision_type: annotation_validation
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - marker_dotplot_validated
      - marker_vlnplot_validated
      - cross_method_with_marker
    description: "DotPlot/VlnPlot 展示已知marker表达 + 多方法交叉验证"
  level_2:
    methods:
      - marker_list_checked
    description: "检查了marker基因列表, 但未可视化"
    conditions_when_acceptable: "当注释结果与已知marker一致且无歧义时"
  level_1:
    methods:
      - marker_not_checked
      - assumed_correct
    description: "未做marker验证, 直接信任自动注释结果"
    note: "自动注释的top hit可能不是正确的细胞类型, 尤其在复杂组织中"
  level_0:
    methods:
      - conflicting_marker_ignored
    description: "已知marker矛盾但被忽略 — 注释可能是错误的"
    rationale: "如果注释为'肝细胞'但表达EPCAM(上皮marker), 注释需要审查"

evidence:
  - source_type: consensus_guideline
    pmid: "31217225"
    doi: "10.15252/msb.20188746"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Confirmed
    excerpt: "Cell identities can be annotated by comparing data-derived marker genes with marker genes from the literature, or by directly visualizing the expression values of literature-derived markers."
    supports_levels: ["level_3", "level_2"]
    # 2026-09-16 收尾核查补核：原文 Cluster annotation 节近逐字（automatic/canonical 为规则措辞；该语境为基于 marker 的注释验证）
  # 2026-09-16 收尾核对（窗口自查原文）：Aran 2019 全文无「top correlation scores」/「requires validation」表述（top correlation 0 命中；validate 仅用于验证 SingleR 自身）→ 槽位删除
conflicts_with: []
