# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：2026-09-15 人类裁定「仍成立」（43 条依据标识符已先行更正，见 DP-scRNA-REVIEW-WORKSHEET.md / -FEEDBACK.md）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"          # none / authoring / domain_review / literature_check / correction
  basis_year_span: [2017, 2019]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "单细胞 RNA-seq 分析链路"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "单细胞 QC 过滤方法 / scRNA QC filtering method"
description: "单细胞RNA-seq质量控制应使用自适应阈值（MAD/中位数绝对偏差）而非硬阈值。硬阈值不考虑数据异质性，不同样本/实验的QC指标分布差异大。MAD自适应方法根据数据本身的分布设定阈值，更稳健。"
condition:
  decision_type: qc_filtering
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
  level_3:
    methods:
      - MAD5_adaptive_threshold
      - adaptive_threshold
    description: "MAD-based自适应阈值 — 根据数据分布动态设定QC cutoff"
    rationale: "scater (McCarthy et al. 2017) 的 MAD 离群值检测支撑自适应 QC；Luecken & Theis 2019 的主张是离群峰检测、联合考量与尽量宽松（经原文核对）"
  level_2:
    methods:
      - 3MAD
      - percentile_based
    description: "百分位数/3MAD法 — 可接受但不考虑数据异质性"
    conditions_when_acceptable: "当数据集小(<1000 cells)且来自单一批次时, 百分位法定阈值可接受"
  level_1:
    methods:
      - hard_threshold
      - fixed_threshold
    description: "硬阈值 — 不考虑数据异质性, 可能导致过度或不足过滤"
    note: "硬阈值(如Mito<25% for all cells)可能在不同组织/实验间过滤不一致"
    conditions_when_acceptable: "当有充分先验知识且所有样本来自同一组织同一方案时"
  level_0:
    methods:
      - no_qc
      - no_filtering
    description: "无QC — 低质量细胞/双联体/死细胞直接进入下游, 结果不可靠"

evidence:
  - source_type: consensus_guideline
    pmid: "31217225"
    doi: "10.15252/msb.20188746"
    title: "Current best practices in single-cell RNA-seq analysis: a tutorial — Luecken & Theis 2019, Molecular Systems Biology"
    confidence: L-Confirmed
    excerpt: "QC is performed by finding outlier peaks in the number of genes, the count depth and the fraction of mitochondrial reads, considering these covariates jointly; thresholds should be as permissive as possible."
    supports_levels: ["level_3"]
    # 2026-09-16 收尾核对（窗口自查原文）：该文 QC Pitfalls 节逐字组合；「median absolute deviation」全文 0 命中 → MAD 主张保留在 scater/McCarthy 2017 槽位（详见 DP-scRNA-REVIEW-FEEDBACK.md「收尾核查」节）
  - source_type: method_paper
    pmid: "28088763"
    doi: "10.1093/bioinformatics/btw777"
    title: "Scater: pre-processing, quality control, normalization and visualization of single-cell RNA-seq data in R — McCarthy et al. 2017, Bioinformatics"
    confidence: L-Confirmed
    excerpt: "scater implements MAD-based outlier detection for QC metrics."
    supports_levels: ["level_3", "level_2"]
conflicts_with: []
