rule_id: I4.2-IMMU-001
domain: IMMUNE
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：本条依据全部有结论（人类 2026-09-15 裁定「仍成立」）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"
  basis_year_span: [2013, 2015]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "泛癌分析链路（含 DEG / 富集 / 生存 / 免疫浸润等）"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "肿瘤纯度混杂校正 / Tumor purity confounding adjustment"
description: "免疫浸润与基因表达的相关性分析中,肿瘤纯度是重要的混杂因子。高纯度肿瘤样本中免疫细胞比例低,可能导致基因表达与免疫评分的虚假负相关。必须考虑肿瘤纯度校正或至少在讨论中提及此限制。"
condition:
  decision_type: purity_confounding
  required_context:
    analysis_type: immune_expression_correlation

scoring:
  level_3:
    methods:
      - purity_adjusted_partial_correlation
      - ESTIMATE_purity_correction
      - consensusTME_purity_adjustment
      - partial_Spearman_with_purity
    description: "使用偏相关或工具校正肿瘤纯度 — 严谨"
    rationale: "偏相关(partial correlation)在控制肿瘤纯度后评估免疫-表达关联,减少虚假关联 (Aran et al. 2015)"
  level_2:
    methods:
      - purity_discussed_as_limitation
      - stratification_by_purity
    description: "按纯度分层分析或明确讨论此限制 — 可接受"
  level_1:
    methods:
      - purity_mentioned_without_action
    description: "提及纯度混杂但未采取任何措施 — 不足"
  level_0:
    methods:
      - purity_ignored
      - no_purity_consideration
    description: "完全忽略肿瘤纯度影响 — 结论可能存在虚假关联"

evidence:
  - source_type: method_paper
    pmid: "26634437"
    title: "Systematic pan-cancer analysis of tumour purity — Aran et al. 2015, Nature Communications"
    confidence: L-Confirmed
    excerpt: "Tumour purity significantly confounds gene expression and immune infiltration correlations."
    supports_levels: ["level_3", "level_0"]
  - source_type: method_paper
    pmid: "24113773"
    title: "Inferring tumour purity and stromal and immune cell admixture from expression data — Yoshihara et al. 2013, Nature Communications"
    confidence: L-Confirmed
    excerpt: "ESTIMATE algorithm quantifies tumour purity which should be accounted for in expression-immune association analysis."
    supports_levels: ["level_3"]
