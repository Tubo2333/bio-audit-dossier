rule_id: "D1.2-DEG-001"
domain: "data_handling.filtering"
status: "active"
version: 2
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-13"  # 领域复核已定：本条依据全部有结论（Conesa 2016 / edgeR Guide §2.7 节号经人眼核对 / Bourgon 2010）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"
  basis_year_span: [2010, 2016]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "该规则所属分析家族；适用范围的正式声明待领域复核填写（本字段在家族副本之间保持一致）"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "低表达基因过滤策略选择"
description: >
  D1 FIX: Level 4 改为 filterByExpr()/independent filtering。
  过滤太严 → 丢失真阳性信号。过滤太松 → 多重检验负担过大。

condition:
  decision_type: "filtering"
  required_context:
    sequencing: "bulk_RNA_seq"
  context_constraints:
    - "n_replicates >= 2"

scoring:
  level_4:
    status: "planned"            # 尚未实现：LLM 评估档位只留了位置
    methods: []
    description: "v0.2 — 由模型给出理由的评估"
  level_3:
    methods:
      - "filterByExpr"
      - "independent_filtering"
      - "DESeq2_independentFiltering"
      - "CPM_filter_with_replicate_awareness"
    description: "filterByExpr() (edgeR) 或 independentFiltering (DESeq2) — 方法自适应阈值"
    rationale: "领域金标准是 filterByExpr / independent filtering，而非固定阈值 CPM>1"
  level_2:
    methods:
      - "CPM_filter_min_samples"
      - "counts_per_million_min"
      - "mean_expression_filter"
      - "median_expression_filter"
    note: "固定阈值方法 — 在极端文库大小下不够精确"
  level_1:
    methods:
      - "no_filtering"
    note: "不过滤 → 低表达基因噪声大 + 多重检验负担增加"
  level_0:
    methods:
      - "filter_by_variance_only"
      - "percentile_cutoff_on_normalized_data"
    note: "仅在归一化数据上做过滤可能保留噪声基因或移除有生物学意义的低表达基因"

evidence:
  # 2026-09-16 收尾核查补核（窗口自查原文 Conesa 2016 全文）：filterByExpr 0 命中（系 edgeR 函数，真出处为本文件 edgeR Guide 槽位）；「低表达过滤提升检验功效」原文无（Conesa 的 filtering 语境是融合/同源基因/核糖体 RNA 过滤）→ Conesa 槽位删除；过滤主张由 edgeR Guide + Bourgon 2010 槽位承担
  - source_type: "reference"   # 软件手册，不是共识指南（2026-09-13 复核）
    url: "https://bioconductor.org/packages/release/bioc/vignettes/edgeR/inst/doc/edgeRUsersGuide.pdf"
    title: "edgeR User's Guide §2.7 Filtering (filterByExpr)"   # 节号经人眼核对现行 PDF（2026-09-13）：§2.5 是伪比对、§2.6 是 DGEList，Filtering 是 §2.7
    confidence: "L-Consensus"
    excerpt: "filterByExpr() determines a threshold based on experimental design and library sizes."
    supports_levels: ["level_3"]

  - source_type: "benchmark_paper"
    doi: "10.1073/pnas.0914005107"
    pmid: "20460310"
    title: "Bourgon et al. (2010) PNAS — Independent filtering increases detection power"
    confidence: "L-Consensus"
    excerpt: "Independent filtering increases detection power while maintaining FDR control."
    supports_levels: ["level_3"]
