rule_id: P2.2-PROG-001
domain: PROGNOSIS
status: active
version: 1
# ---------------------------------------------------------------------------
# 生命周期（DP-RULE-LIBRARY-LIFECYCLE）：这条规则的依据属于什么时候、由谁看过、
# 自称覆盖什么、多久该重看。**填的是事实，不是判断。**
# reviewed_at: null 表示"尚未人工/领域复核"——这不是缺陷，是如实陈述；
# 一旦有人复核，填上日期，库就会把它算作已覆盖，并在超过窗口后提示重看。
# ---------------------------------------------------------------------------
provenance:
  reviewed_at: "2026-09-15"   # 领域复核已定：本条依据全部有结论（人类 2026-09-15 裁定「仍成立」）
  reviewed_by: "人类（领域判断；窗口代记）"
  review_kind: "domain_review"
  basis_year_span: [1996, 2015]   # 所依据文献的年份跨度（由代码内的 DOI/年份自动导出）

scope_of_validity:
  applies_to: null             # 待领域复核填写：这条规则自称适用于什么
  not_applicable_to: null      # 待领域复核填写：它明确不管什么
  family_hint: "泛癌分析链路（含 DEG / 富集 / 生存 / 免疫浸润等）"

update_policy:
  review_window_months: 24     # 超过这个时间未复核 → 库标注"待重看"（是提示，不是作废）
  supersedes: null             # 它替换了谁
  superseded_by: null          # 它被谁替换（替换时由更新流程写入）

title: "独立预后因素声明 / Independent prognostic factor claim"
description: "'独立预后因素'的结论必须基于多变量Cox回归(调整了已知临床协变量)而非单变量分析。单变量显著≠独立预测。这是预后标志物文献中最常见的科学错误之一。"
condition:
  decision_type: independent_prognostic_claim
  required_context:
    analysis_type: survival_analysis

scoring:
  level_3:
    methods:
      - multivariate_Cox_with_clinical_covariates
      - multivariable_adjusted_HR
      - multivariate_Cox_model
    description: "多变量Cox回归调整临床协变量后报告独立预后价值"
    rationale: "只有调整了年龄/分期/分级等已知预后因素后仍显著的HR才能证明独立预后价值 (Bradburn et al. 2003)"
  level_2:
    methods:
      - multivariate_Cox_minimal_covariates
      - stepwise_selection_Cox
    description: "多变量Cox但协变量不全或用逐步选择 — 次优"
    note: "逐步回归存在过拟合和选择偏差风险 (Harrell 2015)"
  level_1:
    methods:
      - univariate_only_acknowledged_limitation
    description: "仅单变量但明确承认局限性 — 部分可信"
  level_0:
    methods:
      - univariate_Cox_claiming_independent
      - "claims_independent_from_univariate_only"
      - "单变量声称独立预后因素"
    description: "单变量分析声称'独立预后因素' — 科学错误"
    rationale: "单变量分析无法区分该基因与已知预后因素之间的相关性。潜在的混淆: 基因高表达可能仅仅是高级别肿瘤的伴随现象。"

evidence:
  - source_type: consensus_guideline
    pmid: "8841020"
    title: "Tumor marker utility grading system: a framework to evaluate clinical utility of tumor markers — Hayes et al. 1996, JNCI (updated by Simon et al. 2009)"
    confidence: L-Consensus
    excerpt: "Independent prognostic value requires demonstration in a multivariable model adjusting for standard clinicopathological factors."
    supports_levels: ["level_3", "level_0"]
  - source_type: method_paper
    pmid: "12888808"
    title: "Survival analysis part II: multivariate data analysis — Bradburn et al. 2003, British Journal of Cancer"
    confidence: L-Consensus
    excerpt: "Multivariable Cox models adjust for confounding between prognostic factors."
    supports_levels: ["level_3"]
  - source_type: method_paper
    doi: "10.1007/978-3-319-19425-7"
    title: "Regression Modeling Strategies, 2nd ed. — Harrell 2015, Springer"
    confidence: L-Consensus
    excerpt: "Stepwise variable selection leads to biased coefficient estimates and inflated R²."
    supports_levels: ["level_2"]
