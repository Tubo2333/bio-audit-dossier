# 决策类型：normalization（bulk 归一化）— preprocessing / bulk-DEG, pan-cancer
decision_type: normalization
display:
  cn: 归一化方法
  en: Normalization method
stage: preprocessing
paradigms: [bulk-DEG, pan-cancer]
dimension: data_handling
optional: false
# 同源声明（跨范式，非匹配通道）：scRNA 的 scRNA_normalization
aliases: [scRNA_normalization]
depends_on: [filtering]
context_schema:
  - key: data_category
    type: enum
    values: [raw_counts, tpm, fpkm, rpkm, normalized_counts, umi_counts]
    required: true
    missing: fail-closed
  - key: sequencing
    type: enum
    values: [bulk_RNA_seq, 10X_scRNA_seq, smartseq2]
    required: true
    missing: fail-closed
