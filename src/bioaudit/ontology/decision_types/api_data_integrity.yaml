# 决策类型：api_data_integrity（数据完整性）— data-acquisition / scRNA
decision_type: api_data_integrity
display:
  cn: 数据获取与完整性
  en: Data acquisition integrity
stage: data-acquisition
paradigms: [scRNA]
dimension: data_handling
optional: false
aliases: []
depends_on: []
context_schema:
  - key: data_source
    # 窗口 M（2026-08-16）：enum → string——原枚举为"来源类别"，但实测
    # 语境（benchmark 任务）存放具体数据集 ID（GSE115978 等），枚举过度
    # 约束会触发 A3 枚举外值 → 误标 unverified（21 处任务决策实测）。
    # 类型校验仍生效（string），A2 罚分规则引用约束不变。
    type: string
    required: true
    # A2：被罚分规则（A1.1-API）引用 → 禁止 fail-open
    missing: fail-closed
  - key: data_format
    type: enum
    values: [h5ad, h5, loom, mtx, rds, csv]
    required: true
    # A2：被罚分规则（A1.1-API）引用 → 禁止 fail-open
    missing: fail-closed
  - key: n_cells
    type: int
    min: 0
    required: false
    missing: fail-closed
  - key: n_genes
    type: int
    min: 0
    required: false
    missing: fail-closed
